name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          include-prerelease: false

      - name: Verify .NET Version
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Select Xcode
        run: |
          # 備註：在 macos-latest 環境，直接用預設 Xcode 通常最安全
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      # 修正點 1：使用標準的 restore，自動為這個專案補齊 android 和 ios 負載（解決解讀專案時的報錯）
      - name: Install MAUI Workloads
        run: |
          dotnet workload restore ./BookViewer.Maui.csproj
          dotnet workload list

      # 修正點 2：加入 --no-restore 避免在 publish 時又重複解讀其他未指定的 TargetFramework
      - name: Build iOS IPA
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true \
            -p:IpaPackageDir="./publish-output"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ./publish-output/*.ipa
          if-no-files-found: error
