name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json for .NET 9
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          include-prerelease: false

      - name: Verify .NET Version
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Install MAUI Workloads
        run: |
          dotnet workload install ios maui android
          dotnet workload list

      - name: Restore Dependencies
        run: |
          dotnet restore ./BookViewer.Maui.csproj -p:TargetFramework=net9.0-ios
                
      - name: Build iOS IPA
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true \
            -p:IpaPackageDir="./publish-output"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ./publish-output/*.ipa
          if-no-files-found: error
