name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android Workload
        run: |
          dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      - name: Restore Dependencies
        run: |
          dotnet restore BookViewer.Android.csproj

      - name: Build Android APK
        run: |
          dotnet publish BookViewer.Android.csproj -c Release \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:EnableCodeSigning=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-App-Package
          path: ./bin/Release/net9.0-android/android-arm64/*.apk
          if-no-files-found: error
