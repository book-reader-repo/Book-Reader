name: Build Mobile Apps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android Workload
        run: |
          dotnet workload install android maui

      - name: Build Android APK
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -o ./publish-android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ./publish-android/*-Signed.apk
          if-no-files-found: warn

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install iOS Workload
        run: |
          dotnet workload install ios maui

      - name: Build iOS IPA
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true \
            -p:IpaPackageDir="./publish-ios"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ./publish-ios/*.ipa
          if-no-files-found: error
